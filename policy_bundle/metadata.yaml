test_time_compute: Seven tasks (LiftPot, StackTwoBlocks, StackSingleBookShelf, PackBox, PickSingleBookFromTable,
  RotateValve, CubeHandover) use a pose hybrid. A ResNet18 regressor (one per task) estimates object poses from the three
  cameras and proprioception (at reset, and on every step where the object moves), and a fixed observation-only controller,
  ported from our scripted training-data experts, plans end-effector motions from these estimates and tracks them with
  the robot's kinematic model. No simulator state is read at test time. LiftTray uses the learned policy, where a flow-matching
  sampler (10 Euler steps) predicts a 16-step action chunk at every control step (20 Hz), and overlapping chunks are
  combined by ACT-style temporal ensembling (weights exp(-0.01 i)).
